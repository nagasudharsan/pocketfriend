<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sign Up - Pocket Friend</title>
  <meta name="description" content="Create your free Pocket Friend student pocket-money account.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <!-- PWA & Favicon Meta -->
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6366f1">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
</head>

<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;">

  <div style="width: 100%; max-width: 460px; margin: 0 auto;">

    <!-- Top Branding -->
    <div style="text-align: center; margin-bottom: 24px;">
      <a href="index.html" style="display: inline-flex; align-items: center; gap: 10px; margin-bottom: 12px;">
        <div class="brand-icon-box" style="width: 48px; height: 48px;">
          <img src="img/wallet.avif" alt="Pocket Friend Logo" style="width: 30px; height: 30px;">
        </div>
      </a>
      <h1 style="font-size: 24px; font-weight: 900; color: var(--text-main); letter-spacing: -0.5px;">Create Free Account</h1>
      <p style="font-size: 13.5px; color: var(--text-muted); margin-top: 4px;">Start taking charge of your pocket money today</p>
    </div>

    <!-- Signup Card -->
    <div class="card" style="padding: 32px 28px; box-shadow: var(--shadow-lg);">
      <form id="signup-form" novalidate>
        <div class="form-group">
          <label for="signup-name" class="form-label">Full Name</label>
          <input type="text" id="signup-name" class="form-control" placeholder="e.g. Alex Sharma" required autofocus>
        </div>

        <div class="form-group">
          <label for="signup-email" class="form-label">Email Address</label>
          <input type="email" id="signup-email" class="form-control" placeholder="student@college.edu" required>
        </div>

        <div class="form-group">
          <label for="signup-password" class="form-label">Password</label>
          <input type="password" id="signup-password" class="form-control" placeholder="Min 6 characters" minlength="6" required>
        </div>

        <div class="form-group">
          <label for="signup-confirm-password" class="form-label">Confirm Password</label>
          <input type="password" id="signup-confirm-password" class="form-control" placeholder="Re-enter password" minlength="6" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" style="height: 50px; margin-top: 10px;">
          ✨ Create Free Account
        </button>
      </form>
    </div>

    <div style="text-align: center; margin-top: 20px; font-size: 13.5px; color: var(--text-secondary);">
      Already have an account? <a href="login.html" style="color: var(--primary); font-weight: 700;">Log In</a>
    </div>

  </div>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
</body>

</html>
